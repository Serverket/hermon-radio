<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radio Hermón — Sin conexión</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(45deg, #02e1ba 5%, #7cb1bf 35%, #dde0d7 63%, #ffdd77 100%);
      background-size: 400% 400%;
      animation: Gradient 120s ease infinite;
      color: #1f2937;
      text-align: center;
      padding: 2rem;
    }
    @keyframes Gradient {
      0% { background-position: 0 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0 50%; }
    }
    .card {
      background: rgba(255,255,255,0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      max-width: 380px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.75rem; }
    p { font-size: 1rem; opacity: 0.8; margin-bottom: 1.5rem; }
    button {
      background: #02e1ba;
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      padding: 0.65rem 1.5rem;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sin conexión</h1>
    <p>Parece que no tienes conexión a internet. Verifica tu red e intenta de nuevo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
